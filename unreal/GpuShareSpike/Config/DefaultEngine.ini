; ============================================================================
;  DefaultEngine.ini
;
;  Le righe che contano per questo spike sono commentate una per una.
;  Puoi cambiarle anche dalla UI (Project Settings): l'editor riscrive questo
;  file. Se lo modifichi a mano, l'editor va riavviato.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
; La mappa la crei tu una volta sola: File > New Level > Empty Level,
; salva come Content/Maps/SpikeMap. Tutto il resto (piano, cubi, luci, attore
; di cattura) viene costruito da UGpuShareSceneSubsystem in C++.
EditorStartupMap=/Game/Maps/SpikeMap.SpikeMap
GameDefaultMap=/Game/Maps/SpikeMap.SpikeMap

; ----------------------------------------------------------------------------
;  FORZATURA DELL'RHI A DIRECTX 11
;
;  DefaultGraphicsRHI vale sia per l'editor sia per il gioco. In alternativa
;  (o in aggiunta) puoi passare -d3d11 sulla riga di comando.
;
;  VERIFICA, NON FIDARTI: nel log (Saved/Logs/*.log) devono comparire righe
;  con categoria LogD3D11RHI e NESSUNA LogD3D12RHI. E' l'unico controllo che
;  non mente. Il modulo si rifiuta comunque di partire se l'RHI non e' D3D11
;  (vedi UGpuShareSettings::bRequireD3D11).
; ----------------------------------------------------------------------------

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11
+D3D11TargetedShaderFormats=PCD3D_SM5
-D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioSampleRate=48000

[/Script/Engine.RendererSettings]
; --- Feature che su D3D11/SM5 non esistono o sono rotte -------------------
; Nanite: richiede SM6. Su D3D11 semplicemente non c'e'.
r.Nanite.ProjectEnabled=False
; Virtual Shadow Maps: SM6. Torniamo alle shadow map classiche.
r.Shadow.Virtual.Enable=0
; Lumen: in UE 5.7 e' ROTTO su SM5 (uno shader StochasticLighting vuole 8 UAV
; contro il limite hardware di 4 di SM5 - regressione rispetto a 5.6).
; Lo disattiviamo esplicitamente invece di lasciarlo fallire a runtime.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; Ray tracing: solo D3D12.
r.RayTracing=False

; --- Tutto quello che sporca una misura di latenza ------------------------
; Anti-aliasing: FXAA. E' spaziale, non temporale: niente accumulo tra frame,
; niente storia che confonda la lettura dei pixel del marker.
; (0=nessuno, 1=FXAA, 2=TAA, 3=MSAA, 4=TSR)
r.DefaultFeature.AntiAliasing=1
; L'auto-esposizione fa variare la luminosita' nel tempo: rende difficile
; capire a occhio se un frame e' nuovo o ripetuto.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
; Vsync: introdurrebbe un'attesa che non c'entra nulla con l'anello misurato.
r.VSync=False
; Tutto in questa scena e' Movable: niente lightmap, niente "lighting needs to
; be rebuilt".
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=False

[/Script/Engine.Engine]
; Lo "smoothing" del frame rate fa aspettare artificialmente il motore per
; rendere il frame time piu' regolare. Per una misura di latenza e' rumore puro.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[SystemSettings]
r.VSync=0
; 0 = illimitato. Se vuoi cappare il frame rate di Unreal usa
; Project Settings > Plugins > GPU Share Spike > Engine Max FPS,
; che lo imposta al BeginPlay ed e' quello che conta a runtime.
t.MaxFPS=0

[/Script/Engine.PhysicsSettings]
bSubstepping=False

